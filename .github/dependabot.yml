version: 2
updates:
  # One npm entry for all three apps: a group spans every directory listed here, so a
  # week's minor and patch updates arrive as one PR. Majors arrive one PR each.
  # Every entry waits `cooldown` days after a release before Dependabot proposes it.
  # Hijacked releases are usually caught and pulled within days, so the wait keeps them
  # out. Security updates ignore the cooldown and the schedule.
  - package-ecosystem: "npm"
    directories:
      - "/apps/console"
      - "/apps/site"
      - "/apps/desktop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # A backlog of security fixes arrives as one PR per ecosystem, not one per package.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
