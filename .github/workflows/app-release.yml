# ContextCake release: build, sign, notarize, and staple the app for every row
# of the release platform table, publish them as one GitHub Release, then deploy
# the matching public Web Demo and install site from the same tagged commit.
#
# Trigger: push of an `app-v*` tag whose commit is an ancestor of main.
# Dry run: `workflow_dispatch` builds and verifies every platform row but never
# publishes a release or deploys a site. Only a tag push publishes.
# Secrets (see specs/contextcake-distribution/design.md §8):
#   CSC_LINK / CSC_KEY_PASSWORD          — Developer ID Application cert (.p12, base64)
#   APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER — notarytool App Store Connect key
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — Web Demo and site deploys
# Repository variable:
#   DEB_MAINTAINER — the .deb's Maintainer field ("Name <address>"). Every run
#   that builds the .deb, dry runs included, stops without it.
# Key rotation: revoke in the Apple Developer portal, reissue, replace these
# secrets. Keys never live in the repository.
#
# Without the complete Apple signing credential set, the workflow builds
# unsigned inspection artifacts but does NOT create a GitHub Release;
# unnotarized builds are never distributed (distribution spec §7).
#
# Job order (design §11.5): build-mac → smoke-mac-x64, and build-linux beside
# them; both feed publish → public-surfaces.
# Artifact names come from scripts/release-platforms.mjs; no step here spells
# one out. `publish` checks every table row before it writes SHA256SUMS and
# again before it creates the release, so a missing row publishes nothing.
#
# Releases ship WITHOUT accounts: the packaging step no longer receives
# Supabase configuration, so the published app has no sign-in. To build one
# that does, set CC_ACCOUNTS=1 plus SUPABASE_URL/SUPABASE_ANON_KEY. See
# docs/release-gates.md for why the default flipped.
name: ContextCake Release

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify every platform row without publishing or deploying. Must stay true: only an app-v tag push publishes."
        type: boolean
        required: true
        default: true

jobs:
  release-preflight:
    name: verify coordinated release credentials
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Refuse a publishing dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        run: |
          echo "::error::A manual run is always a dry run. Publish by pushing an app-v tag on main."
          exit 1

      - name: Require public-surface deployment credentials
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::A ContextCake release requires matching Web Demo and site deployments. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID before tagging."
            exit 1
          fi
          for project in contextcake-console contextcake; do
            curl --fail --silent --show-error --output /dev/null \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project"
          done

  build-mac:
    name: build, sign, and notarize Mac (arm64 + x64)
    runs-on: macos-14
    needs:
      - release-preflight
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.creds.outputs.signed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main and matches package version
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit $GITHUB_SHA is not an ancestor of main"
            exit 1
          fi
          # electron-builder + electron-updater key the release, artifact names,
          # and latest-mac.yml off apps/desktop/package.json version. If the tag
          # and package version disagree, the release publishes but no installed
          # app ever updates to it — refuse rather than ship a dead release.
          TAG_VERSION="${GITHUB_REF_NAME#app-v}"
          PKG_VERSION="$(node -p 'require("./apps/desktop/package.json").version')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $TAG_VERSION but apps/desktop/package.json is $PKG_VERSION"
            exit 1
          fi

      - name: Resolve release version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#app-v}"
          else
            VERSION="$(node -p 'require("./apps/desktop/package.json").version')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The signed app, standalone CLI package, and MCPB use exactly one
          # release identity. A mismatch makes an otherwise valid artifact
          # impossible to support or audit, so stop before the expensive Mac build.
          VERSION="$VERSION" node --input-type=module -e '
            import { assertVersionAlignment } from "./scripts/distribution-artifacts.mjs";
            await assertVersionAlignment(process.env.VERSION);
          '

      - name: Verify no release gate is open
        run: |
          # A gate declared only in a GitHub issue is enforceable only by
          # someone remembering it, which is exactly how the hosted-OAuth
          # checks in #44 came to be deferred through three releases. The
          # gates live in docs/release-gates.md; an open one stops the build.
          if grep -q '^## Open:' docs/release-gates.md; then
            if [ "$GITHUB_EVENT_NAME" != "push" ]; then
              echo "::warning::Release gate open in docs/release-gates.md. A dry run continues; a tagged release would stop here."
              exit 0
            fi
            echo "::error::Release gate open in docs/release-gates.md:"
            grep '^## Open:' docs/release-gates.md >&2
            echo "Close the gate (move it under '## Closed:' with its evidence) or, to ship anyway, say so explicitly in that file." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Detect signing secrets
        id: creds
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ] \
            && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] \
            && [ -n "$APPLE_API_ISSUER" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing/notarization secrets absent — building unsigned, release will NOT be published"
          fi

      - name: Install console deps
        working-directory: apps/console
        run: npm ci

      - name: Build Web Demo
        working-directory: apps/console
        run: npm run build

      - name: Record Web Demo release provenance
        working-directory: apps/console
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module -e \
            'import { writeFile } from "node:fs/promises"; await writeFile("dist/release.json", JSON.stringify({ tag: process.env.RELEASE_TAG, commit: process.env.RELEASE_COMMIT }) + "\n")'

      - name: Upload Web Demo artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-demo-dist
          path: apps/console/dist
          retention-days: 7

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci

      - name: Write notary key file
        if: steps.creds.outputs.signed == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/notary-key.p8"

      # `npm run dist` builds every arch electron-builder.yml lists for mac
      # (arm64 and x64), each with its DMG and zip, and one latest-mac.yml.
      - name: Build, sign, notarize
        if: steps.creds.outputs.signed == 'true'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/notary-key.p8"
          # --publish never: on a tag build electron-builder would otherwise try
          # to auto-publish (and fail without GH_TOKEN, or create a duplicate
          # v* release). The publish job's gh CLI step is the sole publisher.
          npm run dist -- --publish never --config.mac.notarize=true

      - name: Build (unsigned — no release)
        if: steps.creds.outputs.signed != 'true'
        working-directory: apps/desktop
        run: npm run dist -- --publish never

      # electron-builder writes the arm64 app to dist/mac-arm64 and the x64
      # app to dist/mac (x64 is its default arch, so it gets no suffix).
      - name: Check each app is native to its architecture
        working-directory: apps/desktop
        run: |
          check() {
            APP=$(find "$1" -maxdepth 1 -name "*.app" | head -1)
            if [ -z "$APP" ]; then echo "::error::No app bundle in $1"; exit 1; fi
            ARCHS=$(lipo -archs "$APP/Contents/MacOS/ContextCake")
            if [ "$ARCHS" != "$2" ]; then echo "::error::$APP is '$ARCHS', expected '$2'"; exit 1; fi
            echo "$APP: $ARCHS"
          }
          check dist/mac-arm64 arm64
          check dist/mac x86_64

      - name: Gatekeeper assessment
        if: steps.creds.outputs.signed == 'true'
        working-directory: apps/desktop
        run: |
          for DIR in dist/mac-arm64 dist/mac; do
            APP=$(find "$DIR" -maxdepth 1 -name "*.app" | head -1)
            codesign --verify --deep --strict "$APP"
            spctl -a -vv -t install "$APP"
            xcrun stapler validate "$APP"
          done

      - name: Verify every Mac platform row was built
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-platforms.mjs --check apps/desktop/dist --version "$VERSION" --stage build --os mac

      - name: Stage Mac artifacts from the platform table
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-mac
          for KIND in installers updaters feeds; do
            for NAME in $(node scripts/release-platforms.mjs --list "$KIND" --version "$VERSION" --os mac); do
              cp "apps/desktop/dist/$NAME" "release-mac/$NAME"
            done
          done
          ls -l release-mac

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac
          path: release-mac
          if-no-files-found: error
          retention-days: 7

  # The build runs on Apple silicon, so the x64 app has not run anywhere yet.
  # Launch the exact zip the updater and the Intel DMG ship on a real Intel Mac.
  smoke-mac-x64:
    name: smoke the x64 app on Intel macOS
    runs-on: macos-15-intel
    needs:
      - build-mac
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download Mac artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-mac
          path: release-mac

      - name: Launch the Intel build
        shell: bash
        env:
          VERSION: ${{ needs.build-mac.outputs.version }}
        run: |
          ZIP="release-mac/$(node scripts/release-platforms.mjs --list updaters --version "$VERSION" --id mac-x64)"
          ditto -x -k "$ZIP" smoke-app
          BIN=smoke-app/ContextCake.app/Contents/MacOS/ContextCake
          test "$(uname -m)" = x86_64
          test "$(lipo -archs "$BIN")" = x86_64
          CC_SMOKE=1 "$BIN" | tee smoke.log
          grep -q "SMOKE OK" smoke.log

  # The Linux .deb (linux-x64-deb row). Not signed: its integrity is its
  # SHA256SUMS line. The job installs the package it built and boots it with
  # Chromium's sandbox on, the way a user's machine runs it.
  build-linux:
    name: build and smoke the Linux .deb (x64)
    runs-on: ubuntu-24.04
    needs:
      - release-preflight
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      CC_DEB_MAINTAINER: ${{ vars.DEB_MAINTAINER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require the .deb maintainer
        run: |
          if [ -z "$CC_DEB_MAINTAINER" ]; then
            echo "::error::Set the DEB_MAINTAINER repository variable (\"Name <address>\") before building the .deb."
            exit 1
          fi

      - name: Resolve release version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#app-v}"
          else
            VERSION="$(node -p 'require("./apps/desktop/package.json").version')"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install console deps
        working-directory: apps/console
        run: npm ci

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci

      # dist:linux builds the renderer, refuses to run without the maintainer,
      # and checks the packaged accounts marker.
      - name: Build the .deb
        working-directory: apps/desktop
        run: npm run dist:linux -- --publish never

      - name: Verify the Linux platform row was built
        run: node scripts/release-platforms.mjs --check apps/desktop/dist --version "$VERSION" --stage build --os linux

      - name: Install the .deb
        run: |
          DEB="$(node scripts/release-platforms.mjs --list installers --version "$VERSION" --os linux)"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "./apps/desktop/dist/$DEB" xvfb xauth
          ls -l /opt/ContextCake/contextcake-desktop /opt/ContextCake/chrome-sandbox /usr/bin/contextcake-desktop
          # The postinst loads this profile on Ubuntu 24.04+, which is what lets
          # the sandbox create its user namespace.
          ls -l /etc/apparmor.d/contextcake-desktop
          sudo aa-status | grep -F contextcake-desktop || echo "::warning::AppArmor does not list a loaded contextcake-desktop profile"
          test "$(cat /opt/ContextCake/resources/package-type)" = deb

      # No sandbox switch and no ELECTRON_DISABLE_SANDBOX: the smoke line must
      # report sandbox=on, or the product would ship depending on a disabled
      # sandbox.
      - name: Launch the installed app with the sandbox on
        shell: bash
        run: |
          set -o pipefail
          env -u ELECTRON_DISABLE_SANDBOX CC_SMOKE=1 xvfb-run -a /opt/ContextCake/contextcake-desktop 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log
          grep -q "sandbox=on" smoke.log
          test -d "$HOME/.config/contextcake"

      - name: Run the bundled CLI through its shim
        run: /opt/ContextCake/resources/bin/contextcake --version

      - name: Stage Linux artifacts from the platform table
        run: |
          mkdir -p release-linux
          for KIND in installers updaters feeds; do
            for NAME in $(node scripts/release-platforms.mjs --list "$KIND" --version "$VERSION" --os linux); do
              cp "apps/desktop/dist/$NAME" "release-linux/$NAME"
            done
          done
          ls -l release-linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: release-linux
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish every platform row
    runs-on: ubuntu-latest
    needs:
      - build-mac
      - smoke-mac-x64
      - build-linux
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
    env:
      VERSION: ${{ needs.build-mac.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download Mac artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-mac
          path: release-dist

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux
          path: release-dist

      # Every row, not only this OS: a release attaches every platform or none.
      - name: Verify every platform row was built
        run: node scripts/release-platforms.mjs --check release-dist --version "$VERSION" --stage build

      - name: Build verified distribution channel artifacts
        run: node scripts/build-distribution-artifacts.mjs --version "$VERSION" --dist release-dist

      - name: Prepare anonymous install counters
        run: |
          for NAME in $(node scripts/release-platforms.mjs --list pings --version "$VERSION"); do
            cp apps/desktop/release-assets/install-ping.txt "release-dist/$NAME"
          done
          cp apps/desktop/release-assets/mcpb-install-ping.txt release-dist/mcpb-install-ping.txt

      - name: Checksums
        run: |
          NAMES="$(node scripts/release-platforms.mjs --list checksummed --version "$VERSION") ContextCake-$VERSION.mcpb contextcake-$VERSION.tgz"
          (cd release-dist && sha256sum $NAMES > SHA256SUMS && cat SHA256SUMS)

      - name: Verify the release is complete
        run: node scripts/release-platforms.mjs --check release-dist --version "$VERSION" --stage publish

      - name: Publish GitHub Release
        id: release
        if: needs.build-mac.outputs.signed == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=""
          for KIND in installers updaters feeds pings; do
            FILES="$FILES $(node scripts/release-platforms.mjs --list "$KIND" --version "$VERSION" | tr '\n' ' ')"
          done
          cd release-dist
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ContextCake ${GITHUB_REF_NAME#app-v}" \
            --generate-notes \
            $FILES "ContextCake-$VERSION.mcpb" "contextcake-$VERSION.tgz" \
            contextcake.rb contextcake-mcp-server.json SHA256SUMS mcpb-install-ping.txt
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Upload inspection artifacts (unsigned build or dry run)
        if: needs.build-mac.outputs.signed != 'true' || github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: contextcake-release-inspection
          path: release-dist
          retention-days: 7

  public-surfaces:
    name: deploy matching Web Demo and site
    runs-on: ubuntu-latest
    needs:
      - publish
    if: needs.publish.outputs.released == 'true'
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: contextcake-public-surfaces-production
      cancel-in-progress: false
    env:
      WEB_DEMO_PROJECT_NAME: contextcake-console
      SITE_PROJECT_NAME: contextcake
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install site dependencies
        working-directory: apps/site
        run: npm ci

      - name: Sync tagged published app release
        working-directory: apps/site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-app-release.mjs --tag "$GITHUB_REF_NAME"

      - name: Build release site
        working-directory: apps/site
        run: npm run build

      # Keep the immutable Web Demo artifact isolated from other build output.
      - name: Download Web Demo artifact
        uses: actions/download-artifact@v8
        with:
          name: web-demo-dist
          path: release-artifacts/web-demo/dist

      - name: Deploy Web Demo production
        id: deploy-demo
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: release-artifacts/web-demo
          command: pages deploy dist --project-name=${{ env.WEB_DEMO_PROJECT_NAME }} --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy site production
        id: deploy-site
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/site
          command: pages deploy dist --project-name=${{ env.SITE_PROJECT_NAME }} --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployed release provenance
        env:
          WEB_DEMO_DEPLOYMENT_URL: ${{ steps.deploy-demo.outputs.deployment-url }}
          SITE_DEPLOYMENT_URL: ${{ steps.deploy-site.outputs.deployment-url }}
          EXPECTED_TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          EXPECTED_VERSION="${EXPECTED_VERSION#app-v}" node scripts/verify-release-surfaces.mjs

      - name: Publish coordinated release summary
        env:
          WEB_DEMO_DEPLOYMENT_URL: ${{ steps.deploy-demo.outputs.deployment-url }}
          SITE_DEPLOYMENT_URL: ${{ steps.deploy-site.outputs.deployment-url }}
        run: |
          {
            echo "### Matching public surfaces deployed"
            echo ""
            echo "- App tag: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Web Demo deployment: $WEB_DEMO_DEPLOYMENT_URL"
            echo "- Web Demo live: https://contextcake-console.pages.dev"
            echo "- Site deployment: $SITE_DEPLOYMENT_URL"
            echo "- Site live: https://contextcake.com"
          } >> "$GITHUB_STEP_SUMMARY"
