# ContextCake release: build, sign, notarize, staple, publish the Mac app, then
# deploy the matching public Web Demo and install site from the same tagged commit.
#
# Trigger: push of an `app-v*` tag whose commit is an ancestor of main.
# Secrets (see specs/contextcake-distribution/design.md §8):
#   CSC_LINK / CSC_KEY_PASSWORD          — Developer ID Application cert (.p12, base64)
#   APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER — notarytool App Store Connect key
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — Web Demo and site deploys
# Key rotation: revoke in the Apple Developer portal, reissue, replace these
# secrets. Keys never live in the repository.
#
# Without the complete Apple signing credential set, the workflow builds
# unsigned inspection artifacts but does NOT create a GitHub Release;
# unnotarized builds are never distributed (distribution spec §7).
#
# Releases ship WITHOUT accounts: the packaging step no longer receives
# Supabase configuration, so the published app has no sign-in. To build one
# that does, set CC_ACCOUNTS=1 plus SUPABASE_URL/SUPABASE_ANON_KEY. See
# docs/release-gates.md for why the default flipped.
name: ContextCake Release

on:
  push:
    tags:
      - "app-v*"

jobs:
  release-preflight:
    name: verify coordinated release credentials
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require public-surface deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::A ContextCake release requires matching Web Demo and site deployments. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID before tagging."
            exit 1
          fi
          for project in contextcake-console contextcake; do
            curl --fail --silent --show-error --output /dev/null \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project"
          done

  release:
    runs-on: macos-14
    needs:
      - release-preflight
    permissions:
      contents: write
    outputs:
      signed: ${{ steps.creds.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main and matches package version
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit $GITHUB_SHA is not an ancestor of main"
            exit 1
          fi
          # electron-builder + electron-updater key the release, artifact names,
          # and latest-mac.yml off apps/desktop/package.json version. If the tag
          # and package version disagree, the release publishes but no installed
          # app ever updates to it — refuse rather than ship a dead release.
          TAG_VERSION="${GITHUB_REF_NAME#app-v}"
          PKG_VERSION="$(node -p 'require("./apps/desktop/package.json").version')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $TAG_VERSION but apps/desktop/package.json is $PKG_VERSION"
            exit 1
          fi
          # The signed app, standalone CLI package, and MCPB use exactly one
          # release identity. A mismatch makes an otherwise valid artifact
          # impossible to support or audit, so stop before the expensive Mac build.
          TAG_VERSION="$TAG_VERSION" node --input-type=module -e '
            import { assertVersionAlignment } from "./scripts/distribution-artifacts.mjs";
            await assertVersionAlignment(process.env.TAG_VERSION);
          '

      - name: Verify no release gate is open
        run: |
          # A gate declared only in a GitHub issue is enforceable only by
          # someone remembering it, which is exactly how the hosted-OAuth
          # checks in #44 came to be deferred through three releases. The
          # gates live in docs/release-gates.md; an open one stops the build.
          if grep -q '^## Open:' docs/release-gates.md; then
            echo "::error::Release gate open in docs/release-gates.md:"
            grep '^## Open:' docs/release-gates.md >&2
            echo "Close the gate (move it under '## Closed:' with its evidence) or, to ship anyway, say so explicitly in that file." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Detect signing secrets
        id: creds
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ] \
            && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] \
            && [ -n "$APPLE_API_ISSUER" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing/notarization secrets absent — building unsigned, release will NOT be published"
          fi

      - name: Install console deps
        working-directory: apps/console
        run: npm ci

      - name: Build Web Demo
        working-directory: apps/console
        run: npm run build

      - name: Record Web Demo release provenance
        working-directory: apps/console
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module -e \
            'import { writeFile } from "node:fs/promises"; await writeFile("dist/release.json", JSON.stringify({ tag: process.env.RELEASE_TAG, commit: process.env.RELEASE_COMMIT }) + "\n")'

      - name: Upload Web Demo artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-demo-dist
          path: apps/console/dist
          retention-days: 7

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci

      - name: Write notary key file
        if: steps.creds.outputs.signed == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/notary-key.p8"

      - name: Build, sign, notarize
        if: steps.creds.outputs.signed == 'true'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/notary-key.p8"
          # --publish never: on a tag build electron-builder would otherwise try
          # to auto-publish (and fail without GH_TOKEN, or create a duplicate
          # v* release). The gh CLI step below is the sole publisher.
          npm run dist -- --publish never --config.mac.notarize=true

      - name: Build (unsigned — no release)
        if: steps.creds.outputs.signed != 'true'
        working-directory: apps/desktop
        run: npm run dist -- --publish never

      - name: Gatekeeper assessment
        if: steps.creds.outputs.signed == 'true'
        working-directory: apps/desktop
        run: |
          APP=$(find dist/mac-arm64 -maxdepth 1 -name "*.app" | head -1)
          codesign --verify --deep --strict "$APP"
          spctl -a -vv -t install "$APP"
          xcrun stapler validate "$APP"

      - name: Build verified distribution channel artifacts
        working-directory: apps/desktop
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          node ../../scripts/build-distribution-artifacts.mjs \
            --version "${TAG_VERSION#app-v}" \
            --dist dist

      - name: Checksums
        working-directory: apps/desktop/dist
        run: |
          shasum -a 256 *.dmg *.zip *.mcpb *.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Prepare anonymous install counter
        if: steps.creds.outputs.signed == 'true'
        working-directory: apps/desktop/dist
        run: |
          cp ../release-assets/install-ping.txt install-ping.txt
          cp ../release-assets/mcpb-install-ping.txt mcpb-install-ping.txt

      - name: Publish GitHub Release
        if: steps.creds.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/desktop/dist
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ContextCake ${GITHUB_REF_NAME#app-v}" \
            --generate-notes \
            *.dmg *.zip *.mcpb *.tgz contextcake.rb contextcake-mcp-server.json latest-mac.yml SHA256SUMS install-ping.txt mcpb-install-ping.txt

      - name: Upload artifacts (unsigned build)
        if: steps.creds.outputs.signed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: contextcake-mac-unsigned
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.mcpb
            apps/desktop/dist/*.tgz
            apps/desktop/dist/contextcake.rb
            apps/desktop/dist/contextcake-mcp-server.json
            apps/desktop/dist/latest-mac.yml
          retention-days: 7

  public-surfaces:
    name: deploy matching Web Demo and site
    runs-on: ubuntu-latest
    needs:
      - release
    if: needs.release.outputs.signed == 'true'
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: contextcake-public-surfaces-production
      cancel-in-progress: false
    env:
      WEB_DEMO_PROJECT_NAME: contextcake-console
      SITE_PROJECT_NAME: contextcake
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install site dependencies
        working-directory: apps/site
        run: npm ci

      - name: Sync tagged published app release
        working-directory: apps/site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-app-release.mjs --tag "$GITHUB_REF_NAME"

      - name: Build release site
        working-directory: apps/site
        run: npm run build

      # Keep the immutable Web Demo artifact isolated from other build output.
      - name: Download Web Demo artifact
        uses: actions/download-artifact@v8
        with:
          name: web-demo-dist
          path: release-artifacts/web-demo/dist

      - name: Deploy Web Demo production
        id: deploy-demo
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: release-artifacts/web-demo
          command: pages deploy dist --project-name=${{ env.WEB_DEMO_PROJECT_NAME }} --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy site production
        id: deploy-site
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/site
          command: pages deploy dist --project-name=${{ env.SITE_PROJECT_NAME }} --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployed release provenance
        env:
          WEB_DEMO_DEPLOYMENT_URL: ${{ steps.deploy-demo.outputs.deployment-url }}
          SITE_DEPLOYMENT_URL: ${{ steps.deploy-site.outputs.deployment-url }}
          EXPECTED_TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          EXPECTED_VERSION="${EXPECTED_VERSION#app-v}" node scripts/verify-release-surfaces.mjs

      - name: Publish coordinated release summary
        env:
          WEB_DEMO_DEPLOYMENT_URL: ${{ steps.deploy-demo.outputs.deployment-url }}
          SITE_DEPLOYMENT_URL: ${{ steps.deploy-site.outputs.deployment-url }}
        run: |
          {
            echo "### Matching public surfaces deployed"
            echo ""
            echo "- App tag: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Web Demo deployment: $WEB_DEMO_DEPLOYMENT_URL"
            echo "- Web Demo live: https://contextcake-console.pages.dev"
            echo "- Site deployment: $SITE_DEPLOYMENT_URL"
            echo "- Site live: https://contextcake.com"
          } >> "$GITHUB_STEP_SUMMARY"
