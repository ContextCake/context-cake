name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  engine:
    name: engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run root test suite
        run: npm test

  console:
    name: console
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/console

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  site:
    name: site
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/site

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  desktop:
    name: desktop
    # macOS runner: Electron needs a real windowing environment, and this is
    # the platform the app ships on.
    runs-on: macos-14
    # Hard cap so a boot hang fails in minutes, not at the 6-hour default on a
    # 10x-billed macOS runner.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install console dependencies
        working-directory: apps/console
        run: npm ci

      - name: Build console renderer
        working-directory: apps/console
        run: npm run build:live

      - name: Lockfile agrees with package.json
        working-directory: apps/desktop
        # A stale lockfile merged silently once: a branch cut before a version
        # bump carried the old root version and reverted a dependency patch
        # with it. `npm ci` accepts the mismatch without a word, and the release
        # workflow only compares the tag against package.json — so nothing
        # noticed until a security audit went looking.
        run: |
          PKG=$(node -p 'require("./package.json").version')
          LOCK=$(node -p 'require("./package-lock.json").packages[""].version')
          if [ "$PKG" != "$LOCK" ]; then
            echo "::error::package.json is $PKG but package-lock.json root is $LOCK — run 'npm install --package-lock-only' in apps/desktop"
            exit 1
          fi
          echo "package.json and lockfile agree at $PKG"

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Audit shipped dependencies
        working-directory: apps/desktop
        # Production-only: these are the packages that end up inside the
        # artifact users auto-install. Dev-tree findings are tracked through
        # Dependabot rather than blocking every PR on a transitive build tool.
        run: npm audit --omit=dev --audit-level=high

      - name: Navigation guard test
        working-directory: apps/desktop
        run: npm run test:navigation

      - name: Test desktop auth and settings sync
        working-directory: apps/desktop
        run: npm test

      - name: CLI status test
        working-directory: apps/desktop
        run: npm run test:cli-status

      - name: Smoke test (boot + token gate)
        working-directory: apps/desktop
        shell: bash
        run: npm run smoke | tee smoke.log && grep -q "SMOKE OK" smoke.log

      - name: Smoke test (boot failure fails fast, no hang)
        working-directory: apps/desktop
        run: npm run smoke:bootfail

      # Guards the process split: engine work must never land back on the UI
      # thread, which is what froze the app during first-run setup.
      - name: Engine isolation (UI thread stays responsive while indexing)
        working-directory: apps/desktop
        run: npm run test:isolation

  required:
    name: required
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - engine
      - console
      - site
      - desktop

    steps:
      - name: Enforce required job results
        run: |
          if [ "${{ needs.engine.result }}" != "success" ] || \
             [ "${{ needs.console.result }}" != "success" ] || \
             [ "${{ needs.site.result }}" != "success" ] || \
             [ "${{ needs.desktop.result }}" != "success" ]; then
            echo "At least one required CI job did not succeed." >&2
            exit 1
          fi
