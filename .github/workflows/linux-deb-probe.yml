# TEMPORARY: early feedback for the Linux .deb branch before its PR opens.
# Runs the desktop-linux CI steps and the release workflow's build-linux smoke
# (with a placeholder maintainer, publishing nothing). Removed before review.
name: Linux deb probe

on:
  push:
    branches:
      - c/linux-deb

permissions:
  contents: read

jobs:
  desktop-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRON_DISABLE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libsecret-1-0
      - working-directory: apps/console
        run: npm ci && npm run build:live
      - working-directory: apps/desktop
        run: npm ci
      - working-directory: apps/desktop
        run: xvfb-run -a npm run test:navigation
      - working-directory: apps/desktop
        run: xvfb-run -a npm test
      - working-directory: apps/desktop
        run: npm run test:cli-status
      - working-directory: apps/desktop
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a npm run smoke | tee smoke.log
          grep -q "SMOKE OK" smoke.log
          test -d "${XDG_CONFIG_HOME:-$HOME/.config}/contextcake"

  deb-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC_DEB_MAINTAINER: ContextCake CI probe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: echo "VERSION=$(node -p 'require("./apps/desktop/package.json").version')" >> "$GITHUB_ENV"
      - working-directory: apps/console
        run: npm ci
      - working-directory: apps/desktop
        run: npm ci
      - working-directory: apps/desktop
        run: npm run dist:linux -- --publish never
      - run: node scripts/release-platforms.mjs --check apps/desktop/dist --version "$VERSION" --stage build --os linux
      - run: |
          DEB="$(node scripts/release-platforms.mjs --list installers --version "$VERSION" --os linux)"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "./apps/desktop/dist/$DEB" xvfb xauth
          ls -l /opt/ContextCake/contextcake-desktop /opt/ContextCake/chrome-sandbox /usr/bin/contextcake-desktop
          ls -l /etc/apparmor.d/contextcake-desktop || true
          sudo aa-status | grep -F contextcake-desktop || echo "no loaded profile"
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          test "$(cat /opt/ContextCake/resources/package-type)" = deb
      - shell: bash
        run: |
          set -o pipefail
          env -u ELECTRON_DISABLE_SANDBOX CC_SMOKE=1 xvfb-run -a /opt/ContextCake/contextcake-desktop 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log
          grep -q "sandbox=on" smoke.log
          test -d "$HOME/.config/contextcake"
      - run: /opt/ContextCake/resources/bin/contextcake --version
