# Publishes only after npm's trusted-publisher/OIDC relationship has been
# configured for ContextCake. No long-lived npm token is accepted or stored.
#
# Prerequisites (one-time, by a maintainer):
#   - `contextcake` exists on npm. A trusted publisher can only be attached to
#     an existing package, so the first version is a hand-published 0.0.0
#     placeholder with 2FA.
#   - A trusted publisher on npmjs.com for this repository, this workflow file,
#     and the `npm-publish` environment; token publishing disabled.
#
# The workflow publishes the npm tarball the signed GitHub Release already
# carries, after checking it against that release's SHA256SUMS. It never
# rebuilds the package, so the registry copy is byte-identical to the release
# artifact. Re-running for a version npm already has succeeds only when the
# published integrity matches the release tarball.
name: Publish ContextCake npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published app-vX.Y.Z GitHub Release to publish to npm
        required: true
        type: string
      publish_pointer:
        description: Also publish the non-executable context-cake pointer package at this version
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish provenance-backed npm CLI
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # A shell glob would accept app-v1abc.2.3xyz ([0-9]* is one digit then
          # anything). The tag decides which ref every later step trusts, so it
          # is matched exactly here rather than downstream.
          printf '%s' "$RELEASE_TAG" | grep -Eq '^app-v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::tag must use app-vX.Y.Z"; exit 1
          }

      # refs/tags/ is load-bearing. actions/checkout resolves an unqualified ref
      # as a branch first and only then as a tag, so a branch named app-vX.Y.Z
      # would supersede the signed tag and supply the verification scripts this
      # job runs while holding the npm publishing credential.
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Setup Node with npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 on Node >= 22.14.0
      # (docs.npmjs.com/trusted-publishers). Node 22 bundles npm 10.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install --global --ignore-scripts npm@11.19.0
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const at = (v) => v.split(".").map(Number);
            const newer = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] > b[i]; return true; };
            const npm = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
            if (!newer(at(npm), [11, 5, 1])) throw new Error(`npm ${npm} is older than 11.5.1`);
            if (!newer(at(process.versions.node), [22, 14, 0])) throw new Error(`Node ${process.versions.node} is older than 22.14.0`);
            console.log(`npm ${npm} on Node ${process.versions.node}`);
          '

      - name: Verify published GitHub release and version alignment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo ContextCake/context-cake --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Release must be published and stable") else empty end'
          VERSION="${RELEASE_TAG#app-v}"
          VERSION="$VERSION" node --input-type=module -e '
            import { assertVersionAlignment } from "./scripts/distribution-artifacts.mjs";
            await assertVersionAlignment(process.env.VERSION);
          '

      - name: Download and verify the release tarball
        id: tarball
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#app-v}"
          DIR="$RUNNER_TEMP/npm-release"
          mkdir -p "$DIR"
          gh release download "$RELEASE_TAG" --repo ContextCake/context-cake --dir "$DIR" \
            --pattern "contextcake-$VERSION.tgz" --pattern SHA256SUMS
          INTEGRITY="$(node scripts/verify-npm-tarball.mjs --tarball "$DIR/contextcake-$VERSION.tgz" --sums "$DIR/SHA256SUMS" --version "$VERSION")"
          echo "tgz=$DIR/contextcake-$VERSION.tgz" >> "$GITHUB_OUTPUT"
          echo "integrity=$INTEGRITY" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish contextcake with provenance
        env:
          TGZ: ${{ steps.tarball.outputs.tgz }}
          INTEGRITY: ${{ steps.tarball.outputs.integrity }}
          VERSION: ${{ steps.tarball.outputs.version }}
        run: |
          PUBLISHED="$(npm view "contextcake@$VERSION" dist.integrity 2>/dev/null || true)"
          if [ -n "$PUBLISHED" ]; then
            if [ "$PUBLISHED" = "$INTEGRITY" ]; then
              echo "contextcake@$VERSION is already published with the release tarball's integrity; nothing to do."
              exit 0
            fi
            echo "::error::contextcake@$VERSION is already published with different contents ($PUBLISHED)."
            exit 1
          fi
          npm publish "$TGZ" --provenance --access public
          test "$(npm view "contextcake@$VERSION" dist.integrity)" = "$INTEGRITY"

      # The pointer only reserves the hyphenated name against typosquatting. npm
      # may refuse it as too similar to `contextcake`; that rule already blocks
      # the lookalike for everyone, so a refusal here is not a release problem.
      - name: Publish context-cake pointer package
        if: inputs.publish_pointer
        env:
          VERSION: ${{ steps.tarball.outputs.version }}
        working-directory: packages/npm/context-cake
        run: |
          if [ "$(npm view "context-cake@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
            echo "context-cake@$VERSION is already published; nothing to do."
            exit 0
          fi
          # Unlike contextcake, this package is built here rather than taken
          # from the release, so its shape is asserted before it is published.
          # --ignore-scripts only suppresses this machine's hooks; it does not
          # stop a declared script from reaching consumers' install.
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const pkg = JSON.parse(await readFile("package.json", "utf8"));
            for (const field of ["scripts", "bin", "dependencies", "optionalDependencies", "peerDependencies"]) {
              if (Object.keys(pkg[field] ?? {}).length) throw new Error(`pointer package declares ${field}`);
            }
            if (!Array.isArray(pkg.files) || pkg.files.length === 0) throw new Error("pointer package must declare files");
          '
          npm pack --dry-run --ignore-scripts
          npm publish --ignore-scripts --provenance --access public
