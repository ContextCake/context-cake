appId: com.contextcake.app
productName: ContextCake
copyright: © 2026 ContextCake

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json

# The engine and console ship as plain files (not asar) so the CLI shim can
# exec them under ELECTRON_RUN_AS_NODE and the service can serve the console
# dist from disk.
extraResources:
  - from: ../console/dist
    to: console
  - from: ../../packages/core/src
    to: engine/src
  - from: ../../packages/core/fixtures
    to: engine/fixtures
  - from: src/observability
    to: engine/observability
  - from: src/cli
    to: engine/cli
  - from: resources/bin
    to: bin
  # NOTE: do NOT add package.json as an extraResources entry. electron-builder
  # adds every extraResources source to the asar exclude set, so shipping
  # package.json here drops it from app.asar — Electron then can't resolve the
  # app entry point and pack fails its asar sanity check. The packaged CLI reads
  # the existing package.json inside app.asar through Electron's fs support.
  - from: build/supabase-config.json
    to: supabase-config.json

# Artifact names come from scripts/release-platforms.mjs (mac-arm64, mac-x64).
# Both patterns are set explicitly: electron-builder's defaults drop the arch
# from an x64 DMG, which would give Intel a name no release tool expects.
# scripts/tests/release-platforms.test.mjs expands these patterns for every
# table row and fails on any difference, so change the table and this file
# together. mac.artifactName names the zip; dmg.artifactName overrides it.
mac:
  category: public.app-category.developer-tools
  artifactName: "${productName}-${version}-${arch}-mac.${ext}"
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Flipped on by the release workflow once Apple Developer credentials exist
  # (specs/contextcake-distribution/design.md §8). Never distribute builds
  # that skipped notarization.
  notarize: false

dmg:
  sign: false
  artifactName: "${productName}-${version}-${arch}.${ext}"

# The linux-x64-deb row. Only a .deb: electron-builder's AppImage launcher adds
# --no-sandbox on Ubuntu 24.04+, and the .deb installs an AppArmor profile that
# keeps the sandbox on (design §11.4). ${arch} expands to "amd64" in a .deb
# name. The executable keeps its default name (contextcake-desktop), so the
# postinst's /usr/bin link never shadows the `contextcake` CLI. The package
# needs a maintainer, which scripts/dist-linux.mjs passes in from
# CC_DEB_MAINTAINER at build time; the repository never names one.
linux:
  category: Development
  artifactName: "${productName}-${version}-${arch}.${ext}"
  icon: build/icons
  # desktopName in package.json names the .desktop entry and Electron's
  # WM_CLASS; syncing them lets the desktop match windows to the launcher.
  syncDesktopName: true
  target:
    - target: deb
      arch: [x64]

deb:
  # The one-line summary apt shows; the long description is package.json's.
  synopsis: ContextCake desktop app

# `protocols` also becomes the .desktop entry's MimeType on Linux.
protocols:
  - name: ContextCake
    schemes: [contextcake]

publish:
  provider: github
  owner: ContextCake
  repo: context-cake
