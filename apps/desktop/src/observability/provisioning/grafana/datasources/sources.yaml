apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://127.0.0.1:9090
    access: proxy
    editable: false
  - name: Tempo
    uid: tempo
    type: tempo
    url: http://127.0.0.1:3200
    access: proxy
    editable: false
  - name: Loki
    uid: loki
    type: loki
    url: http://127.0.0.1:3100
    access: proxy
    editable: false
    jsonData:
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: '/d/contextcake-trace/trace?var-traceId=$${__value.raw}&kiosk'
          urlDisplayLabel: View trace
